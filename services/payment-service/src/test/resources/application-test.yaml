spring:
  application:
    name: payment-service

  # Redis Configuration (using embedded or mock)
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

  # Kafka Configuration (using embedded or mock)
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: payment-service-test-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    topics:
      payment-created: payment-created
      payment-approved: payment-approved
      payment-failed: payment-failed
      payment-refunded: payment-refunded
      anomaly-detected: anomaly-detected

# DynamoDB Local (assumes a local instance is running on port 8000 during tests)
aws:
  region: us-east-1
  dynamodb:
    endpoint: http://localhost:8000
    local: true
    tables:
      payments: PaymentsTest
      outbox: PaymentOutboxTest

# Server Configuration
server:
  port: 0

# Logging Configuration
logging:
  level:
    com.rampay.paymentservice: DEBUG
    org.springframework.web: DEBUG

# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
