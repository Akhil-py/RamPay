spring:
  application:
    name: payment-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 2147483647   # Integer.MAX_VALUE — required for idempotence
      enable-idempotence: true
      transaction-id-prefix: rampay-payment-tx-
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false
      isolation-level: read_committed
      max-poll-interval-ms: 300000

aws:
  region: ${AWS_REGION:us-east-1}
  dynamodb:
    endpoint: ${DYNAMODB_ENDPOINT:http://localhost:8000}
    local: ${DYNAMODB_LOCAL:true}
    tables:
      payments: ${DYNAMODB_TABLE_PAYMENTS:Payments}
      outbox: ${DYNAMODB_TABLE_OUTBOX:PaymentOutbox}

server:
  port: ${SERVER_PORT:8080}

payment-service:
  cache:
    payment-ttl: 3600
    idempotency-ttl: 86400
    list-ttl: 300
  idempotency:
    enabled: true
    header-name: Idempotency-Key
  outbox:
    enabled: true
    poll-interval: 5000
    max-retries: 3
  validation:
    max-amount: 1000000.00
    min-amount: 0.01

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}
