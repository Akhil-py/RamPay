name: RamPay CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/payment-service

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: Build
        run: ./mvnw clean package -DskipTests -Dmaven.compiler.source=17 -Dmaven.compiler.target=17

      - name: Test
        run: ./mvnw test -Dmaven.compiler.source=17 -Dmaven.compiler.target=17

      - name: Build Docker image
        run: docker build -t rampay-payment-service:ci .
